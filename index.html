<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План Департамента 2026</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0984e3">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sec: #636e72;
            --accent: #0984e3;
            --wait: #b2bec3;
            --work: #fdcb6e;
            --today: #d63031;
            --done: #00b894;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding-bottom: 80px; }
        header { background: var(--accent); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { margin: 0; font-size: 18px; }

        .filter-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.2); color: white; font-size: 15px; }
        .filter-select option { color: black; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--wait); }
        
        .card-link { text-decoration: none; color: inherit; }
        .card-cat { font-size: 10px; text-transform: uppercase; color: var(--text-sec); font-weight: 700; margin-bottom: 4px; }
        .card-title { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 8px; line-height: 1.3; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #f1f2f6; }
        .card-date { font-size: 12px; color: var(--text-sec); background: #f1f2f6; padding: 4px 8px; border-radius: 6px; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; color: white; }

        /* БОКС ЗАМЕТОК */
        .comment-display { margin-top: 10px; background: #f9f9f9; border-radius: 8px; padding: 10px; font-size: 13px; border-left: 3px solid #dfe6e9; white-space: pre-line; display: none; }
        .comment-display.active { display: block; }

        .comment-section { margin-top: 12px; display: flex; gap: 8px; }
        .comment-input { flex: 1; padding: 10px 14px; border: 1px solid #eee; border-radius: 20px; font-size: 14px; outline: none; }
        .comment-btn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .status-wait { border-left-color: var(--wait); } .status-wait .status-badge { background: var(--wait); }
        .status-work { border-left-color: var(--work); } .status-work .status-badge { background: var(--work); }
        .status-today { border-left-color: var(--today); } .status-today .status-badge { background: var(--today); }
        .status-done { border-left-color: var(--done); } .status-done .status-badge { background: var(--done); }

        #loader { text-align: center; padding: 50px; color: var(--text-sec); }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>План публикации 2026</h1>
            <button style="background:none; border:none; color:white; font-size:20px;" onclick="location.reload()">↻</button>
        </div>
        <select id="categorySelect" class="filter-select" onchange="filterData(this.value)">
            <option value="all">📂 Все направления</option>
        </select>
    </header>

    <div id="loader">Загрузка данных...</div>
    <div class="container" id="app"></div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSiUUHVFLpn5WE5zwI7UOCNNz4gjENAX4ahMtDO7f8e_qvUpwTqtaBN0nfUzOU5unXMWvzwU5zhSkB/pub?output=csv';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpDK0afwiRK9pBXeqt0vCStRzdvucCUgcWsbAsabJpXwbAj0aN3jId5aTqX2fqhJjWhg/exec';

    let allData = [];

    function fetchSheetData() {
        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                parseData(results.data);
            }
        });
    }

    function parseData(rows) {
        let currentCat = "Общее";
        let lastTitle = "";
        allData = [];

        rows.forEach((row, i) => {
            if (i === 0) return;
            let name = row[0] ? row[0].trim() : "";
            let start = row[1] ? row[1].trim() : "";
            let end = row[2] ? row[2].trim() : "";
            let link = row[3] ? row[3].trim() : "";
            let comm = row[4] ? row[4].trim() : "";

            if (name && !start && !end) { currentCat = name; return; }
            if (!name && (start || end)) name = lastTitle;
            if (!name) return;
            lastTitle = name;

            allData.push({
                name: name,
                category: currentCat,
                endTxt: end,
                url: link || "https://stat.gov.kz/",
                comment: comm,
                // Для статуса используем упрощенную логику (можно вернуть вашу дату)
                status: (end.includes("января") || end.includes("01")) ? "today" : "wait" 
            });
        });

        document.getElementById('loader').style.display = 'none';
        renderCards('all');
        updateFilterList();
    }

    function renderCards(filter) {
        const container = document.getElementById('app');
        container.innerHTML = "";
        const filtered = filter === 'all' ? allData : allData.filter(d => d.category === filter);

        filtered.forEach((item, index) => {
            const cardId = "card-" + index;
            const div = document.createElement('div');
            div.className = `card status-${item.status}`;
            div.innerHTML = `
                <a href="${item.url}" target="_blank" class="card-link">
                    <div class="card-cat">${item.category}</div>
                    <div class="card-title">${item.name}</div>
                    <div class="card-footer">
                        <div class="card-date">📅 ${item.endTxt}</div>
                        <div class="status-badge">В ПЛАНЕ</div>
                    </div>
                </a>
                
                <div id="box-${cardId}" class="comment-display ${item.comment ? 'active' : ''}">
                    <b>Заметки:</b><br><span id="text-${cardId}">${item.comment}</span>
                </div>

                <div class="comment-section">
                    <input type="text" class="comment-input" id="input-${cardId}" placeholder="Ваш комментарий...">
                    <button class="comment-btn" onclick="sendComment('${cardId}', '${item.name.replace(/'/g, "\\'")}')">➤</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function sendComment(cardId, itemName) {
        const input = document.getElementById(`input-${cardId}`);
        const displayBox = document.getElementById(`box-${cardId}`);
        const textSpan = document.getElementById(`text-${cardId}`);
        const text = input.value.trim();

        if (!text) return;

        const btn = input.nextElementSibling;
        btn.innerHTML = "⏳";
        btn.disabled = true;

        // Мгновенно обновляем интерфейс
        const currentText = textSpan.innerText;
        textSpan.innerText = (currentText ? currentText + "\n" : "") + "✍️ " + text;
        displayBox.classList.add('active');
        input.value = "";

        // Отправка в таблицу
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ name: itemName, comment: text })
        }).then(() => {
            btn.innerHTML = "✅";
            setTimeout(() => { btn.innerHTML = "➤"; btn.disabled = false; }, 2000);
        }).catch(() => {
            alert("Ошибка отправки");
            btn.innerHTML = "➤";
            btn.disabled = false;
        });
    }

    function updateFilterList() {
        const cats = [...new Set(allData.map(d => d.category))];
        const select = document.getElementById('categorySelect');
        cats.forEach(c => {
            const o = document.createElement('option');
            o.value = c; o.innerText = c; select.appendChild(o);
        });
    }

    function filterData(val) { renderCards(val); }

    fetchSheetData();
</script>
</body>
</html>
