<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План Департамента 2026</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0984e3">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sec: #636e72;
            --accent: #0984e3;
            /* Статусы */
            --wait: #b2bec3;
            --work: #fdcb6e;
            --today: #d63031;
            --done: #00b894;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding-bottom: 40px; }
        
        /* ШАПКА */
        header { 
            background: linear-gradient(135deg, #0984e3, #74b9ff); 
            color: white; padding: 15px 20px; 
            position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        
        /* БЕГУНОК */
        .filter-select {
            width: 100%; padding: 12px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.4); 
            background: rgba(255,255,255,0.2); 
            color: white; font-size: 16px; outline: none;
            backdrop-filter: blur(10px); font-weight: 500;
            cursor: pointer;
        }
        .filter-select option { color: #333; background: white; }

        /* СЕТКА (3 КОЛОНКИ) */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 3 равные колонки */
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        /* КОЛОНКИ */
        .col-header {
            font-size: 14px; font-weight: 700; text-transform: uppercase; 
            margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .col-today .col-header { color: var(--today); border-color: var(--today); }
        .col-wait .col-header { color: var(--text-sec); border-color: var(--wait); }
        .col-done .col-header { color: var(--done); border-color: var(--done); }
        
        .counter { background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #555; }

        /* КАРТОЧКА */
        .card { 
            background: var(--card-bg); border-radius: 16px; 
            padding: 15px; margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            border-left: 5px solid var(--wait); 
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }

        /* Стили статусов карточек */
        .card.status-today, .card.status-work { border-left-color: var(--today); background: #fff5f5; }
        .card.status-wait { border-left-color: var(--wait); }
        .card.status-done { border-left-color: var(--done); opacity: 0.8; }
        
        .card-link { text-decoration: none; color: inherit; display: block; }
        .card-cat { font-size: 10px; text-transform: uppercase; color: var(--text-sec); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
        .card-title { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; line-height: 1.4; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 10px; }
        .card-date { font-size: 12px; font-weight: 500; color: #555; background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 6px; }
        
        /* Блок комментариев */
        .comment-display {
            background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; 
            font-size: 13px; color: #444; margin-bottom: 10px; display: none;
        }
        .comment-display.active { display: block; }
        
        .comment-section { display: flex; gap: 8px; }
        .comment-input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; outline: none; transition: 0.2s; }
        .comment-input:focus { border-color: var(--accent); }
        .comment-btn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* АДАПТИВНОСТЬ (МОБИЛЬНЫЙ ВИД) */
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; gap: 30px; }
            /* Порядок блоков на телефоне */
            .col-today { order: 1; }
            .col-wait { order: 2; }
            .col-done { order: 3; }
        }

        #loader { text-align: center; padding: 50px; color: #777; font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>План Департамента 2026</h1>
            <button style="background:none; border:none; color:white; font-size:24px; cursor:pointer;" onclick="hardReload()">↻</button>
        </div>
        <select id="categorySelect" class="filter-select" onchange="filterData(this.value)">
            <option value="all">📂 Все Отрасли</option>
        </select>
    </header>

    <div id="loader">Загрузка данных...</div>
    
    <div class="grid-container" id="mainGrid" style="display:none;">
        
        <div class="col-today">
            <div class="col-header">
                🔥 Срочно / В работе <span id="count-today" class="counter">0</span>
            </div>
            <div id="list-today"></div>
        </div>

        <div class="col-wait">
            <div class="col-header">
                ⏳ Ожидание <span id="count-wait" class="counter">0</span>
            </div>
            <div id="list-wait"></div>
        </div>

        <div class="col-done">
            <div class="col-header">
                ✅ Выполнено <span id="count-done" class="counter">0</span>
            </div>
            <div id="list-done"></div>
        </div>

    </div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSiUUHVFLpn5WE5zwI7UOCNNz4gjENAX4ahMtDO7f8e_qvUpwTqtaBN0nfUzOU5unXMWvzwU5zhSkB/pub?output=csv';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpDK0afwiRK9pBXeqt0vCStRzdvucCUgcWsbAsabJpXwbAj0aN3jId5aTqX2fqhJjWhg/exec';
    
    let allData = [];
    const currentYear = new Date().getFullYear();

    function hardReload() {
        if ('caches' in window) caches.keys().then(names => names.forEach(name => caches.delete(name)));
        location.reload(true);
    }

    function fetchSheetData() {
        Papa.parse(SHEET_CSV_URL, {
            download: true, header: false,
            complete: function(results) { parseData(results.data); },
            error: function() { document.getElementById('loader').innerHTML = "Ошибка загрузки"; }
        });
    }

    function parseData(rows) {
        let currentCat = "Общее";
        let lastTitle = "";
        allData = [];

        rows.forEach((row, i) => {
            if (i === 0) return;
            let name = row[0] ? row[0].trim() : "";
            let start = row[1] ? row[1].trim() : "";
            let end = row[2] ? row[2].trim() : "";
            let link = row[3] ? row[3].trim() : "";
            let comm = row[4] ? row[4].trim() : "";

            if (name && !start && !end) { currentCat = name; return; }
            if (!name && (start || end)) name = lastTitle;
            if (!name) return;
            lastTitle = name;

            const dStart = parseRusDate(start);
            const dEnd = parseRusDate(end);

            if (dEnd) {
                allData.push({
                    name: name,
                    category: currentCat,
                    start: dStart,
                    end: dEnd,
                    endTxt: end,
                    url: link || "https://stat.gov.kz/",
                    comment: comm
                });
            }
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('mainGrid').style.display = 'grid';
        updateFilterList();
        renderCards('all');
    }

    function parseRusDate(str) {
        if (!str) return null;
        str = str.toLowerCase().replace(/\./g, ' ').trim();
        const numericMatch = str.match(/^(\d{1,2})\s+(\d{1,2})/);
        if (numericMatch) return new Date(currentYear, parseInt(numericMatch[2]) - 1, parseInt(numericMatch[1]));
        const months = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
        const parts = str.split(' ');
        let mIdx = -1;
        months.forEach((m, i) => { if (parts[1] && parts[1].includes(m)) mIdx = i; });
        return mIdx !== -1 ? new Date(currentYear, mIdx, parseInt(parts[0])) : null;
    }

    function getStatus(start, end) {
        const now = new Date(); now.setHours(0,0,0,0);
        const dEnd = new Date(end); dEnd.setHours(0,0,0,0);
        const dStart = start ? new Date(start) : new Date(dEnd); dStart.setHours(0,0,0,0);

        if (now > dEnd) return { text: "ВЫПОЛНЕНО", class: "done", code: "done" };
        if (now.getTime() === dEnd.getTime()) return { text: "СРОК СЕГОДНЯ", class: "today", code: "today" };
        if (now >= dStart && now < dEnd) return { text: "В РАБОТЕ", class: "work", code: "work" };
        return { text: "ОЖИДАНИЕ", class: "wait", code: "wait" };
    }

    // ГЛАВНАЯ ФУНКЦИЯ ОТРИСОВКИ (СОРТИРОВКА И РАСПРЕДЕЛЕНИЕ)
    function renderCards(filter) {
        // Очищаем колонки
        const listToday = document.getElementById('list-today');
        const listWait = document.getElementById('list-wait');
        const listDone = document.getElementById('list-done');
        listToday.innerHTML = ""; listWait.innerHTML = ""; listDone.innerHTML = "";

        const filtered = filter === 'all' ? allData : allData.filter(d => d.category === filter);

        let countT = 0, countW = 0, countD = 0;

        // Разделяем на массивы для сортировки
        let itemsToday = [];
        let itemsWait = [];
        let itemsDone = [];

        filtered.forEach(item => {
            const status = getStatus(item.start, item.end);
            const dataWithStatus = { ...item, statusObj: status };

            if (status.code === 'done') itemsDone.push(dataWithStatus);
            else if (status.code === 'today' || status.code === 'work') itemsToday.push(dataWithStatus);
            else itemsWait.push(dataWithStatus);
        });

        // СОРТИРОВКА
        // 1. Ожидание: Самые близкие даты сверху (от меньшего к большему)
        itemsWait.sort((a, b) => a.end - b.end);

        // 2. Выполнено: Самые свежие выполненные сверху (от большего к меньшему)
        itemsDone.sort((a, b) => b.end - a.end);

        // Отрисовка
        itemsToday.forEach(item => createCard(item, listToday));
        itemsWait.forEach(item => createCard(item, listWait));
        itemsDone.forEach(item => createCard(item, listDone));

        // Счетчики
        document.getElementById('count-today').innerText = itemsToday.length;
        document.getElementById('count-wait').innerText = itemsWait.length;
        document.getElementById('count-done').innerText = itemsDone.length;
    }

    function createCard(item, container) {
        const index = allData.indexOf(item); // Находим реальный индекс для ID
        const cardId = "c-" + index; 
        
        const div = document.createElement('div');
        div.className = `card status-${item.statusObj.class}`;
        div.innerHTML = `
            <a href="${item.url}" target="_blank" class="card-link">
                <div class="card-cat">${item.category}</div>
                <div class="card-title">${item.name} 🔗</div>
                <div class="card-footer">
                    <div class="card-date">📅 ${item.endTxt}</div>
                </div>
            </a>
            
            <div id="box-${cardId}" class="comment-display ${item.comment ? 'active' : ''}">
                <b>📝 Заметки:</b><br><span id="txt-${cardId}">${item.comment}</span>
            </div>

            <div class="comment-section">
                <input type="text" class="comment-input" id="inp-${cardId}" placeholder="Комментарий...">
                <button class="comment-btn" onclick="sendComment('${cardId}', '${item.name.replace(/'/g, "\\'")}', '${item.endTxt}')">➤</button>
            </div>
        `;
        container.appendChild(div);
    }

    function sendComment(cardId, itemName, itemDate) {
        const input = document.getElementById(`inp-${cardId}`);
        const textBox = document.getElementById(`txt-${cardId}`);
        const boxDiv = document.getElementById(`box-${cardId}`);
        const text = input.value.trim();

        if (!text) return;

        const btn = input.nextElementSibling;
        btn.innerHTML = "⏳";
        btn.disabled = true;

        const now = new Date();
        const timeStr = now.getDate() + "." + (now.getMonth()+1) + " " + now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
        const newEntry = `[${timeStr}] ${text}`;
        
        textBox.innerText = textBox.innerText ? textBox.innerText + "\n" + newEntry : newEntry;
        boxDiv.classList.add('active');
        input.value = "";

        fetch(APPS_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: itemName, date: itemDate, comment: text })
        }).then(() => {
            btn.innerHTML = "✅";
            setTimeout(() => { btn.innerHTML = "➤"; btn.disabled = false; }, 2000);
        }).catch(err => {
            alert("Ошибка сети.");
            btn.innerHTML = "➤"; btn.disabled = false;
        });
    }

    function updateFilterList() {
        const cats = [...new Set(allData.map(d => d.category))];
        const select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="all">📂 Все Отрасли</option>';
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.innerText = c; select.appendChild(opt);
        });
    }

    window.filterData = function(val) { renderCards(val); }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    fetchSheetData();
</script>
</body>
</html>
