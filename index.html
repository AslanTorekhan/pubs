<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План Департамента 2026</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0984e3">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sec: #636e72;
            --accent: #0984e3;
            /* Статусы */
            --wait: #b2bec3;
            --work: #fdcb6e;
            --today: #d63031;
            --done: #00b894;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding-bottom: 40px; }
        
        /* ШАПКА */
        .header { background: var(--accent); color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .header-controls { margin-top: 10px; display: flex; gap: 10px; }
        .search-box { flex-grow: 1; padding: 8px; border-radius: 6px; border: none; font-size: 14px; }
        .filter-select { padding: 8px; border-radius: 6px; border: none; font-size: 14px; background: white; }

        /* СПИСОК КАРТОЧЕК */
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s; border-left: 5px solid transparent; }
        .card:active { transform: scale(0.98); }

        /* Цвета статусов (полоска слева) */
        .status-wait { border-left-color: var(--wait); }
        .status-work { border-left-color: var(--work); }
        .status-today { border-left-color: var(--today); }
        .status-done { border-left-color: var(--done); }

        .card-cat { font-size: 10px; text-transform: uppercase; color: var(--text-sec); letter-spacing: 1px; margin-bottom: 5px; font-weight: bold; }
        .card-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; }
        .card-link { text-decoration: none; color: inherit; display: block; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--text-sec); border-top: 1px solid #eee; padding-top: 8px; }
        .card-date { font-weight: 500; display: flex; align-items: center; gap: 5px; }
        
        /* Стили для смены даты */
        .edit-date-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.5; padding: 0 5px; }
        .edit-date-btn:hover { opacity: 1; transform: scale(1.1); }
        .date-edit-form { display: none; background: #f1f2f6; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .date-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 5px; box-sizing: border-box;}
        .save-date-btn { width: 100%; background: var(--done); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Комментарии */
        .comment-section { margin-top: 10px; display: flex; gap: 5px; }
        .comment-input { flex-grow: 1; padding: 8px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 13px; }
        .comment-btn { background: var(--accent); color: white; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        
        .comment-display { 
            font-size: 12px; color: #444; background: #f9f9f9; padding: 8px; border-radius: 6px; margin-top: 8px; 
            display: none; /* Скрыт если пустой */
            border-left: 2px solid var(--accent);
        }
        .comment-display.active { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 План Департамента 2026</h1>
        <div class="header-controls">
            <input type="text" class="search-box" id="searchInput" placeholder="Поиск..." onkeyup="filterData()">
            <select class="filter-select" id="categorySelect" onchange="filterData(this.value)">
                <option value="all">Все</option>
            </select>
        </div>
    </div>

    <div class="container" id="content">
        <div style="text-align:center; color:#999; margin-top:50px;">Загрузка данных...</div>
    </div>

    <script>
        // Ссылка на твой Google Script (УЖЕ ВСТАВЛЕНА)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyshEU0jIAtxReqbB_1ADIAcG9XiQ3D0c5Lbf_Xteid-oW8Te8-mUqAOrmzcjL7cWpzMA/exec'; 

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSiUUHVFLpn5WE5zwI7UOCNNz4gjENAX4ahMtDO7f8e_qvUpwTqtaBN0nfUzOU5unXMWvzwU5zhSkB/pub?output=csv';

        let allData = [];

        // 1. Инициализация при загрузке
        window.onload = function() {
            Papa.parse(CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    document.getElementById('content').innerHTML = "Ошибка загрузки: " + err;
                }
            });
            
            // Регистрация Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('SW зарегистрирован'))
                    .catch(err => console.log('SW ошибка:', err));
            }
        };

        // 2. Обработка данных
        function processData(rows) {
            // Удаляем первую строку (заголовки)
            const dataRows = rows.slice(1);
            
            allData = dataRows.map(row => {
                if(!row[0]) return null;

                const dateStr = row[2] ? row[2].trim() : "";
                const statusObj = getStatus(dateStr);

                return {
                    name: row[0],
                    url: row[1] || "#",
                    endTxt: dateStr,
                    category: row[3] || "Общее",
                    comment: row[4] || "",
                    statusObj: statusObj
                };
            }).filter(item => item !== null);

            updateFilterList();
            renderCards(allData);
        }

        // 3. Определение статуса по дате
        function getStatus(dateString) {
            if (!dateString) return { class: "wait", text: "Без даты" };
            
            // Парсим DD.MM.YYYY
            const parts = dateString.split('.');
            if(parts.length < 3) return { class: "wait", text: dateString };

            const targetDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            const today = new Date();
            today.setHours(0,0,0,0);

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { class: "done", text: "Завершено" };
            if (diffDays === 0) return { class: "today", text: "Сегодня!" };
            if (diffDays <= 7) return { class: "work", text: "Скоро" };
            return { class: "wait", text: "В плане" };
        }

        // 4. Отрисовка карточек
        function renderCards(data) {
            const container = document.getElementById('content');
            container.innerHTML = "";
            data.forEach(item => createCard(item, container));
        }

        function createCard(item, container) {
            const index = allData.indexOf(item); 
            const cardId = "c-" + index; 
            
            // Экранируем кавычки для безопасности
            const safeName = item.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");

            const div = document.createElement('div');
            div.className = `card status-${item.statusObj.class}`;
            div.innerHTML = `
                <div style="position:relative;">
                    <a href="${item.url}" target="_blank" class="card-link">
                        <div class="card-cat">${item.category}</div>
                        <div class="card-title">${item.name} 🔗</div>
                    </a>
                    
                    <div class="card-footer">
                        <div class="card-date">
                            📅 <span id="date-val-${cardId}">${item.endTxt}</span>
                            <button class="edit-date-btn" onclick="openDateChanger('${cardId}')">✏️</button>
                        </div>
                    </div>

                    <div id="date-form-${cardId}" class="date-edit-form">
                        <label style="font-size:12px; color:#555;">Новая дата посадки:</label>
                        <input type="date" id="date-input-${cardId}" class="date-input">
                        <button class="save-date-btn" onclick="submitNewDate('${cardId}', '${safeName}', '${item.endTxt}')">Сохранить дату</button>
                        <div style="text-align:center; margin-top:5px;">
                            <span onclick="document.getElementById('date-form-${cardId}').style.display='none'" style="font-size:12px; color:#999; cursor:pointer;">Отмена</span>
                        </div>
                    </div>
                </div>
                
                <div id="box-${cardId}" class="comment-display ${item.comment ? 'active' : ''}">
                    <b>📝 История / Заметки:</b><br><span id="txt-${cardId}" style="white-space: pre-wrap;">${item.comment}</span>
                </div>

                <div class="comment-section">
                    <input type="text" class="comment-input" id="inp-${cardId}" placeholder="Комментарий...">
                    <button class="comment-btn" onclick="sendComment('${cardId}', '${safeName}', '${item.endTxt}')">➤</button>
                </div>
            `;
            container.appendChild(div);
        }

        // 5. Функция открытия формы даты
        function openDateChanger(cardId) {
            document.querySelectorAll('.date-edit-form').forEach(el => el.style.display = 'none');
            document.getElementById(`date-form-${cardId}`).style.display = 'block';
        }

        // 6. Функция ОТПРАВКИ новой даты
        function submitNewDate(cardId, name, oldDateRaw) {
            const dateInput = document.getElementById(`date-input-${cardId}`);
            const newDateIso = dateInput.value; 

            if (!newDateIso) { alert("Пожалуйста, выберите дату."); return; }

            const btn = dateInput.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "Сохранение...";
            btn.disabled = true;

            fetch(APPS_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    type: 'change_date',
                    name: name, 
                    oldDate: oldDateRaw, 
                    newDate: newDateIso 
                })
            }).then(() => {
                const parts = newDateIso.split('-');
                const newDateRus = `${parts[2]}.${parts[1]}.${parts[0]}`;
                
                const dateSpan = document.getElementById(`date-val-${cardId}`);
                dateSpan.innerText = newDateRus;
                dateSpan.style.color = "#d63031";
                dateSpan.style.fontWeight = "bold";

                const textBox = document.getElementById(`txt-${cardId}`);
                const boxDiv = document.getElementById(`box-${cardId}`);
                const now = new Date();
                const timeStr = now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
                
                const historyText = `[${timeStr}] 📅 Перенос: ${oldDateRaw} ➝ ${newDateRus}`;
                textBox.innerText = textBox.innerText ? textBox.innerText + "\n" + historyText : historyText;
                boxDiv.classList.add('active');

                document.getElementById(`date-form-${cardId}`).style.display = 'none';
                btn.innerText = originalText;
                btn.disabled = false;

                alert("Дата успешно изменена!");

            }).catch(err => {
                alert("Ошибка соединения: " + err);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        // 7. Функция отправки комментария
        function sendComment(cardId, itemName, itemDate) {
            const input = document.getElementById(`inp-${cardId}`);
            const textBox = document.getElementById(`txt-${cardId}`);
            const boxDiv = document.getElementById(`box-${cardId}`);
            const text = input.value.trim();

            if (!text) return;
            
            const btn = input.nextElementSibling;
            btn.innerHTML = "⏳";
            btn.disabled = true;

            const now = new Date();
            const timeStr = now.getDate() + "." + (now.getMonth()+1) + " " + now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
            const newEntry = `[${timeStr}] ${text}`;
            
            textBox.innerText = textBox.innerText ? textBox.innerText + "\n" + newEntry : newEntry;
            boxDiv.classList.add('active');
            input.value = "";

            fetch(APPS_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    type: 'comment',
                    name: itemName, 
                    date: itemDate, 
                    comment: text 
                })
            }).then(() => {
                btn.innerHTML = "✅";
                setTimeout(() => { btn.innerHTML = "➤"; btn.disabled = false; }, 2000);
            }).catch(err => {
                alert("Ошибка сети.");
                btn.innerHTML = "➤"; btn.disabled = false;
            });
        }

        // Фильтрация
        function updateFilterList() {
            const cats = [...new Set(allData.map(d => d.category))];
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="all">Все</option>';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c; select.appendChild(opt);
            });
        }

        function filterData() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const catVal = document.getElementById('categorySelect').value;

            const filtered = allData.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                const matchCat = catVal === 'all' || item.category === catVal;
                return matchSearch && matchCat;
            });
            renderCards(filtered);
        }

    </script>
</body>
</html>
